name: Build Bee Education Release APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Junior Bee & Bee Kids APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Content Assets
        run: |
          python tools/sync_drive.py --check-assets

      - name: Configure Android Platform & Gradle
        working-directory: ./flutter_app
        run: |
          # Generate Android platform if missing
          flutter create . --platforms=android --org=com.bee
          # Upgrade Gradle wrapper to 8.5 to satisfy Android Gradle Plugin requirements
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip
          EOF
          # Ensure minSdk is 21
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle 2>/dev/null || true

      - name: Flutter Pub Get
        working-directory: ./flutter_app
        run: flutter pub get

      - name: Build Junior Bee Release APK (G6-G8)
        working-directory: ./flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons -t lib/main_junior.dart
          mkdir -p ../build_output/junior
          find build/ -name "*release*.apk" -exec cp {} ../build_output/junior/Junior_Bee_G6_G8_Release.apk \;

      - name: Build Bee Kids Release APK (Singapore Math Tigrinya)
        working-directory: ./flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons -t lib/main_kids.dart
          mkdir -p ../build_output/kids
          find build/ -name "*release*.apk" -exec cp {} ../build_output/kids/Bee_Kids_Tigrinya_Release.apk \;

      - name: Upload Junior Bee APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: junior-apks
          path: build_output/junior/*.apk
          if-no-files-found: error

      - name: Upload Bee Kids APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-kids-apks
          path: build_output/kids/*.apk
          if-no-files-found: error
